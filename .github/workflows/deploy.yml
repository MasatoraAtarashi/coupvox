name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        # v4 / main push 限定トリガー + SHA ピン済みアクションのため、キャッシュ汚染リスクは許容する
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] main push 限定 + SHA ピン済みのため許容
        with:
          node-version: 22
          # デプロイジョブは明示的にはキャッシュを使わない

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 認証は API トークン方式（Cloudflare は wrangler デプロイ用 OIDC を未提供、2026-08 時点）。
      # トークンは Workers Scripts 編集の最小権限にすること。
      # wrangler-action は package.json の predeploy を経由しないため、
      # マイグレーションはここで明示的に流す。スキーマを先に合わせてから配信する。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
