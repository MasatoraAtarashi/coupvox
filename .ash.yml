# ASH (automated-security-helper) 設定 — squat 共通スターター
# ティアによって global_settings.severity_threshold が変わる（strict=LOW / standard=HIGH / light=CRITICAL）。
# 誤検知が出た場合は suppressions に「理由コメント付き」で追加する（kawasemi 運用と同じ）。
project_name: "coupvox"

global_settings:
  severity_threshold: "LOW"
  ignore_paths:
    - path: node_modules/**
      reason: インストール済み依存のため
    - path: .wrangler/**
      reason: wrangler のローカルビルド・状態ディレクトリのため
    - path: dist/**
      reason: ビルド成果物のため
    - path: build/**
      reason: ビルド成果物のため
    - path: .react-router/**
      reason: react-router のビルドキャッシュのため
    - path: pnpm-lock.yaml
      reason: lockfile のハッシュ値が secret 検出で false positive になるため
    - path: .ash/**
      reason: ASH 自身のレポート出力のため
    - path: worker-configuration.d.ts
      reason: wrangler types が生成する型定義ファイルのため
    - path: .claude/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .agents/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .codex/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: .junie/skills/**
      reason: rulesync が展開する外部スキルのため
    - path: migrations/meta/**
      reason: drizzle-kit が生成するマイグレーションメタデータ（JSON）のため

  # detect-secrets の Secret Keyword は「SECRET という名前への代入」で反応する。
  # 以下はいずれも実際の秘密ではないことを確認したうえで抑制している。
  # 本番の値は wrangler secret（.dev.vars）にあり、リポジトリには入っていない。
  suppressions:
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "server/auth/session.ts"
      reason: localhost 専用の開発用フォールバック鍵。本番は SESSION_SECRET が無ければ null を返してログインさせない
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "wrangler.vitest.jsonc"
      reason: vitest 専用の固定値。テスト以外からは読まれない
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "test/auth.test.ts"
      reason: 署名の検証に使うテスト用の定数
    - rule_id: "SECRET-SECRET-KEYWORD"
      path: "HANDOFF.md"
      reason: 必要な secret の「名前」を列挙している文章で、値は書かれていない
